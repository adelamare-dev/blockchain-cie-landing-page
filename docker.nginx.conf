user nginx nginx;
worker_processes 1;

error_log /var/log/nginx/error_log info;

events {
    worker_connections 128;
    use epoll;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    real_ip_header    X-Forwarded-Proto;

    log_format main
        '$remote_addr,$http_x_forwarded_for,$time_iso8601,$request_time,'
        '"$request",$status,$bytes_sent,'
        '"$http_referer","$http_user_agent",'
        '"$gzip_ratio"';

    tcp_nopush on;
    tcp_nodelay on;
    port_in_redirect off;
    server_tokens off;

    server {
        listen      80;
        listen [::]:80;

        root /usr/share/nginx/html/;
        index index.html;

        gzip on;
        gzip_vary on;
        gzip_comp_level 4;
        gzip_min_length 256;
        gzip_proxied expired no-cache no-store private no_last_modified no_etag auth;
        gzip_types application/atom+xml application/javascript application/json application/ld+json application/manifest+json application/rss+xml application/vnd.geo+json application/vnd.ms-fontobject application/x-web-app-manifest+json application/xhtml+xml application/xml image/bmp image/svg+xml image/x-icon text/cache-manifest text/css text/plain text/vcard text/vnd.rim.location.xloc text/vtt text/x-component text/x-cross-domain-policy;

        location / {
            try_files $uri $uri/ /index.html;
        }

        access_log  /var/log/nginx/access_log  main;
        error_log   /var/log/nginx/error_log   warn;

        location ~ /\.ht {
            deny  all;
        }
    }
}
